<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Horarios | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/admin_agenda.html">Amys Segura &amp; Bella</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navegacionHorarios" aria-controls="navegacionHorarios" aria-expanded="false" aria-label="Mostrar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navegacionHorarios">
          <div class="navbar-nav ms-auto align-items-lg-center">
            <a class="nav-link" href="/admin_agenda.html">Agenda</a>
            <a class="nav-link" href="/admin_catalogo.html">Catálogo de servicios</a>
            <a class="nav-link" href="/reportes.html">Reportes</a>
            <a class="nav-link active" aria-current="page" href="/admin_horarios.html">Horarios</a>
            <button id="cerrarSesionHorarios" class="btn btn-outline-primary ms-lg-3 mt-2 mt-lg-0" type="button">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <div><p class="text-uppercase text-secondary small mb-1">Administración</p><h1 class="h2 mb-1">Horarios de especialistas</h1><p id="nombreUsuarioHorarios" class="text-secondary mb-0"></p></div>
        <button id="agregarHorario" type="button" class="btn btn-primary">Agregar bloque</button>
      </div>
      <div id="mensajeHorarios" class="alert d-none" role="status" aria-live="polite"></div>

      <section class="card filtro-card mb-4">
        <div class="card-body">
          <label for="especialistaHorario" class="form-label">Especialista</label>
          <select id="especialistaHorario" class="form-select"><option value="">Todos los especialistas</option></select>
        </div>
      </section>

      <section class="card admin-card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>Especialista</th><th>Día</th><th>Hora inicio</th><th>Hora fin</th><th>Acciones</th></tr></thead>
              <tbody id="filasHorarios"><tr><td colspan="5" class="text-center text-secondary py-4">Cargando horarios...</td></tr></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="modalHorario" tabindex="-1" aria-labelledby="tituloHorario" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="formHorario">
            <div class="modal-header"><h2 class="modal-title fs-5" id="tituloHorario">Agregar bloque</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
            <div class="modal-body">
              <div class="mb-3"><label for="especialistaHorarioModal" class="form-label">Especialista</label><select id="especialistaHorarioModal" name="id_especialista" class="form-select" required><option value="">Selecciona un especialista</option></select></div>
              <div class="mb-3"><label for="diaHorario" class="form-label">Día</label><select id="diaHorario" name="dia_semana" class="form-select" required><option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="7">Domingo</option></select></div>
              <div class="row g-3"><div class="col-6"><label for="horaInicioHorario" class="form-label">Hora inicio</label><input id="horaInicioHorario" name="hora_inicio" type="time" step="1800" class="form-control" required></div><div class="col-6"><label for="horaFinHorario" class="form-label">Hora fin</label><input id="horaFinHorario" name="hora_fin" type="time" step="1800" class="form-control" required></div></div>
            </div>
            <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin_horarios.js"></script>
  </body>
</html>
