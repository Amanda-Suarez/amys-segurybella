<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comprobante de cita | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar bg-white border-bottom no-print">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/servicios.html">Amys Segura &amp; Bella</a>
        <button id="cerrarSesionComprobante" class="btn btn-outline-primary" type="button">Cerrar sesión</button>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <div id="mensajeComprobante" class="alert d-none no-print" role="alert" aria-live="polite"></div>
      <article id="contenidoComprobante" class="card admin-card mx-auto d-none" style="max-width: 760px;">
        <div class="card-body p-4 p-md-5">
          <header class="text-center mb-4">
            <p class="text-uppercase text-secondary small mb-1">Amys Segura &amp; Bella</p>
            <h1 class="h2">Comprobante de reserva</h1>
            <p id="codigoComprobante" class="fw-semibold servicio-precio mb-0"></p>
          </header>

          <div class="row g-3 mb-4">
            <div class="col-6">
              <span class="small text-secondary d-block">Estado</span>
              <span id="estadoCita" class="badge"></span>
            </div>
            <div class="col-6 text-end">
              <span class="small text-secondary d-block">Modalidad</span>
              <strong id="modalidadCita"></strong>
            </div>
            <div class="col-6">
              <span class="small text-secondary d-block">Fecha</span>
              <strong id="fechaCita"></strong>
            </div>
            <div class="col-6 text-end">
              <span class="small text-secondary d-block">Hora</span>
              <strong id="horaCita"></strong>
            </div>
            <div id="contenedorDireccion" class="col-12 d-none">
              <span class="small text-secondary d-block">Dirección del servicio</span>
              <strong id="direccionCita"></strong>
            </div>
            <div class="col-12">
              <span class="small text-secondary d-block">Especialista</span>
              <strong id="especialistaCita"></strong>
            </div>
          </div>

          <h2 class="h5">Servicios reservados</h2>
          <ul id="listaServiciosCita" class="list-group list-group-flush mb-3"></ul>
          <div class="d-flex justify-content-between border-top pt-3">
            <strong>Total</strong>
            <strong id="totalCita" class="servicio-precio"></strong>
          </div>
          <p class="alert alert-light border mt-4 mb-0">El pago se realiza de forma presencial o por transferencia bancaria.</p>
        </div>
      </article>

      <div class="d-flex justify-content-center gap-2 mt-4 no-print">
        <button id="botonImprimir" type="button" class="btn btn-outline-primary d-none">Imprimir</button>
        <button id="botonCancelar" type="button" class="btn btn-outline-danger d-none">Cancelar cita</button>
      </div>
      <p id="notaCancelacion" class="text-center text-secondary mt-3 no-print d-none"></p>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/comprobante.js"></script>
  </body>
</html>
