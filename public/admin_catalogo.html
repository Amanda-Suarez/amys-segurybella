<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar catálogo | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/admin_agenda.html">Amys Segura &amp; Bella</a>
        <button id="cerrarSesionCatalogo" class="btn btn-outline-primary" type="button">Cerrar sesión</button>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
        <div>
          <p class="text-uppercase text-secondary small mb-1">Administración</p>
          <h1 class="h2 mb-0">Catálogo de servicios</h1>
        </div>
        <button id="nuevoServicio" class="btn btn-primary" type="button" disabled>Nuevo servicio</button>
      </div>

      <div id="mensajeAdminCatalogo" class="alert d-none" role="status" aria-live="polite"></div>
      <section class="card admin-card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle tabla-catalogo mb-0">
              <thead>
                <tr>
                  <th scope="col">Nombre</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Precio</th>
                  <th scope="col">Duración</th>
                  <th scope="col">Estado</th>
                  <th scope="col"><span class="visually-hidden">Acciones</span></th>
                </tr>
              </thead>
              <tbody id="filasServicios">
                <tr><td colspan="6" class="text-center text-secondary py-4">Cargando servicios...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <div class="modal fade" id="modalServicio" tabindex="-1" aria-labelledby="tituloModalServicio" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <form id="formServicio">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="tituloModalServicio">Nuevo servicio</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
              <div class="row g-3">
                <div class="col-12 col-md-8">
                  <label for="nombreServicio" class="form-label">Nombre</label>
                  <input id="nombreServicio" name="nombre_servicio" type="text" class="form-control" maxlength="150" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="categoriaServicio" class="form-label">Categoría</label>
                  <select id="categoriaServicio" name="id_categoria" class="form-select" required>
                    <option value="">Selecciona una categoría</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="descripcionServicio" class="form-label">Descripción</label>
                  <textarea id="descripcionServicio" name="descripcion" class="form-control" rows="3" maxlength="16000"></textarea>
                </div>
                <div class="col-12 col-md-4">
                  <label for="precioServicio" class="form-label">Precio (USD)</label>
                  <input id="precioServicio" name="precio" type="number" class="form-control" min="0.01" max="999999.99" step="0.01" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="duracionServicio" class="form-label">Duración (minutos)</label>
                  <input id="duracionServicio" name="duracion_minutos" type="number" class="form-control" min="5" step="5" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="imagenServicio" class="form-label">URL de imagen <span class="text-secondary">(opcional)</span></label>
                  <input id="imagenServicio" name="imagen_url" type="text" class="form-control" maxlength="500">
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary">Guardar servicio</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/admin_catalogo.js"></script>
  </body>
</html>
