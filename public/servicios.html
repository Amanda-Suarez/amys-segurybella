<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo de servicios | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/estilos.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/servicios.html">Amys Segura &amp; Bella</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navegacionCliente" aria-controls="navegacionCliente" aria-expanded="false" aria-label="Mostrar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navegacionCliente">
          <div class="navbar-nav ms-auto align-items-lg-center">
            <a class="nav-link active" aria-current="page" href="/servicios.html">Inicio</a>
            <a class="nav-link" href="/mis_citas.html">Mis Citas</a>
            <a class="nav-link" href="/perfil.html">Mi Perfil</a>
            <button id="cerrarSesionNav" class="btn btn-outline-primary ms-lg-3 mt-2 mt-lg-0" type="button">Cerrar Sesión</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <header class="mb-4">
        <p class="text-uppercase text-secondary small mb-1">Catálogo digital</p>
        <h1 class="display-6 fw-semibold">Encuentra tu próximo tratamiento</h1>
        <p id="saludoUsuario" class="text-secondary mb-0"></p>
      </header>

      <section class="card filtro-card mb-4" aria-label="Filtros de servicios">
        <div class="card-body">
          <form id="formFiltros" class="row g-3 align-items-end">
            <div class="col-12 col-md-7">
              <label for="buscarServicio" class="form-label">Buscar tratamiento</label>
              <input id="buscarServicio" name="buscar" type="search" class="form-control" maxlength="100" placeholder="Ej. manicura, corte, maquillaje">
            </div>
            <div class="col-12 col-md-5">
              <label for="filtroCategoria" class="form-label">Categoría</label>
              <select id="filtroCategoria" name="categoria" class="form-select">
                <option value="">Todas las categorías</option>
              </select>
            </div>
          </form>
        </div>
      </section>

      <div id="mensajeCatalogo" class="alert d-none" role="status" aria-live="polite"></div>
      <div id="estadoCarga" class="text-center text-secondary py-4">Cargando servicios...</div>
      <section id="listaServicios" class="row g-4" aria-label="Servicios disponibles"></section>
      <section id="sinResultados" class="empty-state text-center py-5 d-none">
        <div class="empty-state__marca mx-auto mb-3">A</div>
        <h2 class="h4">Aún no encontramos ese tratamiento</h2>
        <p class="text-secondary mb-0">Prueba con otra búsqueda o elige una categoría diferente.</p>
      </section>
    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/servicios.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
