<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <section class="card shadow-sm w-100" style="max-width: 560px;">
        <div class="card-body p-4 p-md-5">
          <header class="text-center mb-4">
            <h1 class="h3">Amys Segura &amp; Bella</h1>
            <p class="text-secondary mb-0">Crea tu cuenta de cliente</p>
          </header>

          <div id="mensajeRegistro" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="formRegistro">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input id="nombre" name="nombre" type="text" class="form-control" maxlength="150" autocomplete="name" required>
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input id="correo" name="correo" type="email" class="form-control" maxlength="150" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input id="telefono" name="telefono" type="tel" class="form-control" maxlength="20" autocomplete="tel" required>
            </div>
            <div class="mb-3">
              <label for="direccion" class="form-label">Dirección <span class="text-secondary">(opcional)</span></label>
              <input id="direccion" name="direccion" type="text" class="form-control" maxlength="255" autocomplete="street-address">
            </div>
            <div class="mb-3">
              <label for="contrasenia" class="form-label">Contraseña</label>
              <input id="contrasenia" name="contrasenia" type="password" class="form-control" minlength="8" autocomplete="new-password" required>
              <div class="form-text">Debe tener al menos 8 caracteres.</div>
            </div>
            <div class="mb-4">
              <label for="confirmarContrasenia" class="form-label">Confirmar contraseña</label>
              <input id="confirmarContrasenia" name="confirmarContrasenia" type="password" class="form-control" minlength="8" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
          </form>

          <p class="text-center mt-4 mb-0">
            ¿Ya tienes cuenta? <a href="/login.html">Volver al inicio de sesión</a>
          </p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
