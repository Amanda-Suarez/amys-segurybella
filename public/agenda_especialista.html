<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agenda especialista | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/agenda_especialista.html">Amys Segura &amp; Bella</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navegacionEspecialista" aria-controls="navegacionEspecialista" aria-expanded="false" aria-label="Mostrar navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navegacionEspecialista">
          <div class="navbar-nav ms-auto align-items-lg-center">
            <a class="nav-link active" href="/agenda_especialista.html">Mi agenda</a>
            <button id="cerrarSesionEspecialista" class="btn btn-outline-primary ms-lg-3 mt-2 mt-lg-0" type="button">Cerrar sesión</button>
          </div>
        </div>
      </div>
    </nav>
    <main class="container py-4 py-lg-5">
      <header class="mb-4"><p class="text-uppercase text-secondary small mb-1">Especialista</p><h1 class="h2 mb-1">Mi agenda</h1><p id="nombreUsuario" class="text-secondary mb-0"></p></header>
      <div id="mensajeAgendaEspecialista" class="alert d-none" role="status" aria-live="polite"></div>
      <section class="card filtro-card mb-4">
        <div class="card-body d-flex flex-wrap gap-2 align-items-end">
          <button id="vistaDiaria" type="button" class="btn btn-primary">Agenda diaria</button>
          <button id="vistaSemanal" type="button" class="btn btn-outline-primary">Semana</button>
          <div class="ms-sm-auto"><label for="fechaEspecialista" class="form-label">Fecha</label><input id="fechaEspecialista" type="date" class="form-control"></div>
        </div>
      </section>
      <section id="listaAgendaEspecialista" class="row g-3" aria-live="polite"></section>
    </main>
    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/agenda_especialista.js"></script>
  </body>
</html>
