<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Amys Segura &amp; Bella</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <section class="card shadow-sm w-100" style="max-width: 460px;">
        <div class="card-body p-4 p-md-5">
          <header class="text-center mb-4">
            <h1 class="h3">Amys Segura &amp; Bella</h1>
            <p class="text-secondary mb-0">Inicia sesión para continuar</p>
          </header>

          <div id="mensajeLogin" class="alert d-none" role="alert" aria-live="polite"></div>

          <form id="formLogin">
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input id="correo" name="correo" type="email" class="form-control" autocomplete="email" required>
            </div>
            <div class="mb-4">
              <label for="contrasenia" class="form-label">Contraseña</label>
              <input id="contrasenia" name="contrasenia" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
          </form>

          <p class="text-center mt-4 mb-0">
            ¿Aún no tienes cuenta? <a href="/registro.html">Regístrate aquí</a>
          </p>
        </div>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
